<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Content plan</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b4bde'/%3E%3Cpath d='M8 10h16v15H8z' fill='white'/%3E%3Cpath d='M8 15h16M12 7v6M20 7v6' stroke='%232b4bde' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #182239;
        --muted: #687389;
        --line: #e1e6ef;
        --blue: #2b4bde;
        --surface: #f5f7fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--surface);
        font:
          16px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #809cff;
        outline-offset: 3px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        padding: 8px 13px;
      }
      button:hover {
        background: #eef2fa;
      }
      button.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .danger {
        color: #b42336;
      }
      header {
        background: white;
        border-bottom: 1px solid var(--line);
        padding: 22px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        gap: 13px;
        align-items: center;
      }
      .logo {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 10px;
        display: block;
      }
      h1 {
        font-size: 23px;
        letter-spacing: -0.6px;
        margin: 0;
      }
      .small {
        font-size: 14px;
        color: var(--muted);
      }
      .shell {
        padding: 24px 30px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }
      .month-nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .month-nav h2 {
        font-size: 24px;
        letter-spacing: -0.5px;
        margin: 0 18px 0 0;
        min-width: 160px;
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .filters input,
      .filters select {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        padding: 9px 12px;
        color: var(--ink);
        min-width: 0;
      }
      .search {
        flex: 1;
        min-width: 200px !important;
      }
      .date-filter {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 14px;
      }
      .date-filter input {
        width: 145px;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
      }
      .workspace.open {
        grid-template-columns: minmax(0, 1fr) minmax(340px, 35%);
      }
      .calendar {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .weekdays,
      .grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
      .weekdays {
        border-bottom: 1px solid var(--line);
        background: #f9fafc;
      }
      .weekdays div {
        padding: 12px;
        text-align: right;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      .day {
        min-height: 154px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 8px;
        position: relative;
        min-width: 0;
      }
      .day:nth-child(7n) {
        border-right: 0;
      }
      .day.other {
        background: #f8f9fc;
      }
      .day.weekend {
        background: #fafbfe;
      }
      .day.drag-over {
        background: #e6ecff;
        box-shadow: inset 0 0 0 2px var(--blue);
      }
      .day-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
      }
      .day-number {
        border: 0;
        border-radius: 50%;
        padding: 0;
        width: 29px;
        height: 29px;
        background: transparent;
        font-size: 14px;
      }
      .other .day-number {
        color: #9aa3b4;
      }
      .today .day-number {
        background: var(--blue);
        color: white;
      }
      .day-add {
        border: 0;
        background: transparent;
        padding: 0 5px;
        color: #8b96aa;
        font-size: 20px;
      }
      .card {
        width: 100%;
        text-align: left;
        margin-bottom: 7px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--state);
        padding: 9px;
        border-radius: 7px;
        background: white;
        display: block;
        box-shadow: 0 2px 5px #18223905;
      }
      .card.selected {
        outline: 2px solid #6b87fa;
      }
      .card-title {
        font-size: 14px;
        font-weight: 650;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 6px 0;
      }
      .card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        font-size: 14px;
      }
      .channels {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .channel {
        font-size: 12px;
        font-weight: 750;
        display: inline-grid;
        place-items: center;
        min-width: 23px;
        height: 21px;
        border-radius: 4px;
        background: #edf2ff;
        color: #284ac5;
      }
      .channel.IG {
        color: #a02778;
        background: #fbeaf5;
      }
      .channel.LI {
        color: #12658f;
        background: #e7f4fc;
      }
      .badge {
        display: inline-block;
        border-radius: 5px;
        background: var(--tint);
        color: var(--state);
        padding: 3px 7px;
        font-size: 14px;
        line-height: 1.3;
      }
      .card .badge {
        padding: 2px 4px;
        margin-top: 4px;
        font-size: 12px;
      }
      .thumb {
        width: 100%;
        height: 58px;
        object-fit: cover;
        border-radius: 4px;
        margin-top: 6px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 15px;
        color: var(--muted);
        font-size: 14px;
      }
      .legend span:before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: var(--state);
        margin-right: 6px;
      }
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px;
        align-self: start;
        position: sticky;
        top: 18px;
        max-height: calc(100vh - 36px);
        overflow: auto;
      }
      .panel-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }
      .panel h2 {
        font-size: 23px;
        line-height: 1.3;
        margin: 8px 0 16px;
        overflow-wrap: anywhere;
      }
      .panel h3 {
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
        margin: 24px 0 6px;
      }
      .panel p {
        margin: 0;
      }
      .panel .copy {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .panel a {
        color: var(--blue);
        overflow-wrap: anywhere;
      }
      .panel-image {
        width: 100%;
        max-height: 280px;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 20px;
      }
      .panel-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .close {
        border: 0;
        background: #f1f4f8;
        padding: 3px 10px;
        font-size: 22px;
      }
      .list {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }
      .result {
        display: flex;
        gap: 20px;
        align-items: center;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 16px 0;
      }
      .result:last-child {
        border-bottom: 0;
      }
      .result-title {
        font-weight: 650;
        flex: 1;
      }
      .empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
      }
      .empty h3 {
        color: var(--ink);
        margin: 0 0 8px;
      }
      .empty button {
        margin-top: 12px;
      }
      .empty-strip {
        background: white;
        border: 1px dashed #c9d2e3;
        border-radius: 10px;
        margin-bottom: 18px;
        padding: 16px;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
      }
      .empty-strip p {
        margin: 0;
      }
      .hidden {
        display: none !important;
      }
      dialog {
        border: 0;
        border-radius: 15px;
        width: min(660px, calc(100% - 28px));
        padding: 26px;
        color: var(--ink);
        max-height: 90vh;
        box-shadow: 0 20px 100px #17213b33;
      }
      dialog::backdrop {
        background: #101b3b66;
        backdrop-filter: blur(3px);
      }
      dialog h2 {
        margin: 0;
        font-size: 24px;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
      }
      label.field {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      label.field input,
      label.field textarea,
      label.field select {
        display: block;
        width: 100%;
        border: 1px solid #cfd7e4;
        border-radius: 8px;
        padding: 10px 12px;
        margin-top: 6px;
        background: white;
        color: var(--ink);
        font-size: 16px;
        font-weight: 400;
      }
      textarea {
        resize: vertical;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 18px;
      }
      legend {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
      }
      .network-choice {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-right: 6px;
      }
      .network-choice:has(input:checked) {
        border-color: var(--blue);
        background: #eef2ff;
      }
      .network-choice input {
        accent-color: var(--blue);
        width: 16px;
        height: 16px;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 20px;
      }
      .error {
        color: #b42336;
        font-size: 14px;
      }
      .upload-preview {
        max-height: 120px;
        max-width: 100%;
        border-radius: 8px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #182239;
        color: white;
        padding: 12px 20px;
        border-radius: 9px;
        z-index: 20;
        max-width: 90vw;
      }
      .count {
        color: var(--muted);
        font-size: 14px;
      }
      .status-select {
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        width: 100%;
        font: inherit;
        background: white;
      }
      .day-list {
        margin: 12px 0;
      }
      .more {
        font-size: 14px;
        width: 100%;
        padding: 3px;
      }
      .notice {
        font-size: 14px;
        color: var(--muted);
        margin-top: 16px;
      }
      @media (min-width: 1550px) {
        .day {
          min-height: 175px;
        }
      }
      @media (max-width: 1100px) {
        .shell {
          padding: 20px;
        }
        .workspace.open {
          grid-template-columns: 1fr;
        }
        .panel {
          position: fixed;
          right: 20px;
          top: 20px;
          bottom: 20px;
          width: 420px;
          z-index: 3;
          box-shadow: 0 15px 80px #18223940;
          max-height: calc(100vh - 40px);
        }
        .filters {
          gap: 8px;
        }
        .date-filter {
          flex: 1;
        }
      }
      @media (max-width: 700px) {
        header {
          padding: 16px;
        }
        .shell {
          padding: 14px;
        }
        .toolbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        .month-nav h2 {
          font-size: 21px;
        }
        .day {
          padding: 3px;
          min-height: 120px;
        }
        .weekdays div {
          padding: 8px 4px;
          text-align: center;
        }
        .card {
          padding: 5px;
        }
        .card-meta {
          flex-direction: column;
          align-items: flex-start;
        }
        .card-title {
          font-size: 13px;
        }
        .card .badge {
          font-size: 12px;
        }
        .day-add {
          display: none;
        }
        .thumb {
          display: none;
        }
        .panel {
          left: 10px;
          right: 10px;
          width: auto;
          top: 10px;
          bottom: 10px;
        }
        .empty-strip {
          flex-direction: column;
          align-items: start;
        }
        .two {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .filters select {
          flex: 1;
        }
        .date-filter input {
          width: 130px;
        }
        .result {
          flex-wrap: wrap;
          gap: 8px;
        }
        .result-title {
          min-width: 180px;
        }
        .legend {
          gap: 8px;
        }
        .brand .small {
          font-size: 12px;
        }
      }
      .filter-menu {
        position: relative;
        min-width: 145px;
      }
      .filter-menu summary {
        list-style: none;
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        padding: 9px 12px;
        font-size: 16px;
      }
      .filter-menu summary:after {
        content: "⌄";
        margin-left: 12px;
        color: var(--muted);
      }
      .filter-options {
        position: absolute;
        top: 49px;
        left: 0;
        min-width: 230px;
        z-index: 4;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px;
        box-shadow: 0 8px 30px #18223920;
      }
      .filter-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px;
        font-size: 14px;
        white-space: nowrap;
      }
      .filter-options input {
        accent-color: var(--blue);
        min-width: 16px;
        min-height: 16px;
      }
      .filter-menu:focus-within {
        outline-color: var(--blue);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="logo" src="/assets/sp_logo.png" alt="SP" />
        <div>
          <h1>Content plan</h1>
          <div class="small">Sdílený pracovní plán</div>
        </div>
      </div>
      <button class="primary" id="new" disabled>＋ Nový příspěvek</button>
    </header>
    <main class="shell">
      <div class="toolbar">
        <div class="month-nav">
          <h2 id="month"></h2>
          <button id="prev" aria-label="Předchozí měsíc">‹</button
          ><button id="next" aria-label="Další měsíc">›</button
          ><button id="today">Dnes</button>
        </div>
        <div class="count" id="count"></div>
      </div>
      <div class="filters">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Hledat název, text nebo odkaz…"
          aria-label="Hledat příspěvky"
        />
        <details class="filter-menu">
          <summary id="channel-label">Všechny sítě</summary>
          <div class="filter-options">
            <label
              ><input type="checkbox" data-filter="channel" value="FB" />
              Facebook</label
            ><label
              ><input type="checkbox" data-filter="channel" value="IG" />
              Instagram</label
            ><label
              ><input type="checkbox" data-filter="channel" value="LI" />
              LinkedIn</label
            ><label
              ><input type="checkbox" data-filter="channel" value="NL" />
              Newsletter</label
            >
          </div>
        </details>
        <details class="filter-menu">
          <summary id="status-label">Všechny stavy</summary>
          <div class="filter-options">
            <label
              ><input type="checkbox" data-filter="status" value="draft" /> V
              přípravě</label
            ><label
              ><input type="checkbox" data-filter="status" value="pending" />
              Čeká na schválení</label
            ><label
              ><input type="checkbox" data-filter="status" value="approved" />
              Schváleno</label
            ><label
              ><input type="checkbox" data-filter="status" value="published" />
              Publikováno</label
            >
          </div>
        </details>
        <div class="date-filter">
          <label for="from">Od</label><input id="from" type="date" /><label
            for="to"
            >Do</label
          ><input id="to" type="date" />
        </div>
        <button id="reset">Vymazat filtry</button>
      </div>
      <div id="intro" class="empty-strip hidden">
        <div>
          <strong>Tvůj první content plán</strong>
          <p class="small">
            Přidej příspěvek kliknutím na den nebo si vyzkoušej ukázková data.
          </p>
        </div>
        <button id="demo">Vložit ukázkové příspěvky</button>
      </div>
      <div class="workspace" id="workspace">
        <section id="board" aria-label="Kalendář příspěvků"></section>
        <aside
          id="panel"
          class="panel hidden"
          aria-label="Detail příspěvku"
        ></aside>
      </div>
      <div class="legend" id="legend"></div>
      <p class="notice">
        Data jsou společná pro celý content plán. Časové pásmo: Praha. Stav
        publikace se mění ručně.
      </p>
    </main>
    <dialog id="editor">
      <div class="dialog-head">
        <h2 id="editor-title">Nový příspěvek</h2>
        <button class="close" id="close-editor" aria-label="Zavřít formulář">
          ×
        </button>
      </div>
      <form id="form">
        <label class="field"
          >Interní název <span aria-hidden="true">*</span
          ><input
            name="title"
            required
            maxlength="200"
            placeholder="Např. Nový článek o kancelářích pro Gen Z"
        /></label>
        <div class="two">
          <label class="field"
            >Datum <span aria-hidden="true">*</span
            ><input name="date" type="date" required /></label
          ><label class="field"
            >Čas <span aria-hidden="true">*</span
            ><input name="time" type="time" required
          /></label>
        </div>
        <fieldset>
          <legend>Sítě *</legend>
          <label class="network-choice"
            ><input type="checkbox" name="net" value="FB" /><span
              class="channel"
              >f</span
            >
            Facebook</label
          ><label class="network-choice"
            ><input type="checkbox" name="net" value="IG" /><span
              class="channel IG"
              >ig</span
            >
            Instagram</label
          ><label class="network-choice"
            ><input type="checkbox" name="net" value="LI" /><span
              class="channel LI"
              >in</span
            >
            LinkedIn</label
          ><label class="network-choice"
            ><input type="checkbox" name="net" value="NL" /><span
              class="channel NL"
              >✉</span
            >
            Newsletter</label
          >
          <div id="net-error" class="error" role="alert"></div>
        </fieldset>
        <label class="field"
          ><span id="copy-label">Text příspěvku</span><textarea
            name="text"
            rows="5"
            placeholder="Text, který bude publikován…"
          ></textarea></label
        ><label class="field"
          >Odkaz na článek<input name="url" type="url" placeholder="https://"
        /></label>
        <div class="two">
          <label class="field"
            >Typ obsahu<select name="type">
              <option>Blog</option>
              <option>Social post</option>
              <option>Newsletter</option>
              <option>Video</option>
              <option>Ostatní</option>
            </select></label
          ><label class="field"
            >Stav<select name="state">
              <option value="draft">V přípravě</option>
              <option value="pending">Čeká na schválení</option>
              <option value="approved">Schváleno</option>
              <option value="published">Publikováno</option>
            </select></label
          >
        </div>
        <label id="newsletter-fields" class="field hidden"
          >Témata newsletteru<textarea
            name="newsletterTopics"
            rows="4"
            placeholder="Např. hlavní článek, realizace, akce, případně CTA…"
          ></textarea
        ></label>
        <label class="field"
          >Náhledový obrázek<input
            id="image-input"
            type="file"
            accept="image/jpeg,image/png,image/webp" /></label
        ><label class="field"
          >Nebo vlož URL existujícího obrázku<input
            name="imageUrl"
            type="url"
            placeholder="https://"
        /></label>
        <div id="image-preview"></div>
        <label class="field"
          >Poznámka<textarea
            name="note"
            rows="2"
            placeholder="Např. Čekáme na fotku od architekta."
          ></textarea>
        </label>
        <div id="form-error" class="error" role="alert"></div>
        <div class="form-actions">
          <button type="button" id="cancel">Zrušit</button
          ><button type="submit" class="primary" id="save">
            Uložit příspěvek
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="form-actions">
        <button id="confirm-no">Zrušit</button
        ><button id="confirm-yes" class="primary">Potvrdit</button>
      </div>
    </dialog>
    <div id="toast" class="toast hidden" role="status"></div>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const states = {
        draft: { name: "V přípravě", color: "#617087", tint: "#edf0f5" },
        pending: {
          name: "Čeká na schválení",
          color: "#a36006",
          tint: "#fff3dc",
        },
        approved: { name: "Schváleno", color: "#1e7b50", tint: "#e6f6ed" },
        published: { name: "Publikováno", color: "#2c59c7", tint: "#eaf0ff" },
      };
      const dayKey = (d) =>
          new Intl.DateTimeFormat("sv-SE", {
            timeZone: "Europe/Prague",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).format(d),
        today = () => dayKey(new Date()),
        parseDay = (s) => new Date(s + "T12:00:00"),
        dateLabel = (s) =>
          parseDay(s).toLocaleDateString("cs-CZ", {
            day: "numeric",
            month: "long",
            year: "numeric",
          }),
        norm = (s) =>
          String(s)
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();
      let posts = [],
        month = parseDay(today()),
        selected = null,
        editing = null,
        dirty = false,
        draftImage = "",
        busy = false,
        toastTimer,
        confirmResolve;
      const stateStyle = (s) =>
          `--state:${states[s].color};--tint:${states[s].tint}`,
        badge = (s) =>
          `<span class="badge" style="${stateStyle(s)}">${states[s].name}</span>`,
        networkNames = {
          FB: "Facebook",
          IG: "Instagram",
          LI: "LinkedIn",
          NL: "Newsletter",
        },
        networkMarks = { FB: "f", IG: "ig", LI: "in", NL: "✉" },
        nets = (a) =>
          `<span class="channels">${a.map((n) => `<span class="channel ${n}" title="${networkNames[n] || n}">${networkMarks[n] || n}</span>`).join("")}</span>`;
      function toast(t) {
        $("toast").textContent = t;
        $("toast").classList.remove("hidden");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 4000);
      }
      function confirmAction(title, text) {
        $("confirm-title").textContent = title;
        $("confirm-text").textContent = text;
        $("confirm-dialog").showModal();
        return new Promise((r) => (confirmResolve = r));
      }
      function finishConfirm(value) {
        $("confirm-dialog").close();
        confirmResolve?.(value);
        confirmResolve = null;
      }
      $("confirm-yes").onclick = () => finishConfirm(true);
      $("confirm-no").onclick = () => finishConfirm(false);
      $("confirm-dialog").addEventListener("cancel", (e) => {
        e.preventDefault();
        finishConfirm(false);
      });
      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok)
          throw Error(data.error || "Spojení se serverem se nepodařilo.");
        return data;
      }
      async function openDB() {
        const data = await api("/api/posts");
        posts = Array.isArray(data.posts) ? data.posts : [];
      }
      async function persist(record, remove = false) {
        const data = await api("/api/posts", {
          method: "POST",
          body: JSON.stringify(
            remove
              ? { action: "delete", id: record.id }
              : { action: "upsert", post: record },
          ),
        });
        posts = remove
          ? posts.filter((p) => p.id !== record.id)
          : [...posts.filter((p) => p.id !== record.id), data.post];
      }
      function filtered() {
        const q = norm($("search").value.trim()),
          ch = [
            ...document.querySelectorAll("[data-filter=channel]:checked"),
          ].map((x) => x.value),
          st = [
            ...document.querySelectorAll("[data-filter=status]:checked"),
          ].map((x) => x.value),
          from = $("from").value,
          to = $("to").value;
        return posts
          .filter(
            (p) =>
              (!q ||
                norm(
                  p.title +
                    " " +
                    p.text +
                    " " +
                    p.url +
                    " " +
                    (p.newsletterTopics || ""),
                ).includes(q)) &&
              (!ch.length || p.channels.some((n) => ch.includes(n))) &&
              (!st.length || st.includes(p.state)) &&
              (!from || p.date >= from) &&
              (!to || p.date <= to),
          )
          .sort(
            (a, b) =>
              (a.date + a.time).localeCompare(b.date + b.time) ||
              a.title.localeCompare(b.title),
          );
      }
      function card(p) {
        return `<button class="card ${selected === p.id ? "selected" : ""}" draggable="true" data-post="${p.id}" style="${stateStyle(p.state)}"><span class="card-meta"><span>${esc(p.time)}</span>${nets(p.channels)}</span><span class="card-title">${esc(p.title)}</span>${badge(p.state)}${p.image ? `<img class="thumb" alt="" src="${p.image}">` : ""}</button>`;
      }
      function render() {
        const list = filtered(),
          y = month.getFullYear(),
          m = month.getMonth();
        $("month").textContent = month
          .toLocaleDateString("cs-CZ", { month: "long", year: "numeric" })
          .replace(/^./, (c) => c.toUpperCase());
        $("intro").classList.toggle("hidden", posts.length > 0);
        $("legend").innerHTML = Object.entries(states)
          .map(([k, s]) => `<span style="${stateStyle(k)}">${s.name}</span>`)
          .join("");
        const inMonth = list.filter((p) =>
          p.date.startsWith(`${y}-${String(m + 1).padStart(2, "0")}`),
        );
        $("count").textContent = $("search").value.trim()
          ? `${list.length} výsledků ve všech měsících`
          : `${inMonth.length} příspěvků v měsíci`;
        if (
          $("from").value &&
          $("to").value &&
          $("from").value > $("to").value
        ) {
          $("board").innerHTML =
            '<div class="list empty">Datum Od musí být před datem Do.</div>';
          renderPanel();
          return;
        }
        if ($("search").value.trim()) {
          $("board").innerHTML =
            `<div class="list"><strong>Výsledky hledání</strong>${list.length ? list.map((p) => `<button class="result" data-post="${p.id}"><span class="small">${dateLabel(p.date)}<br>${p.time}</span><span class="result-title">${esc(p.title)}</span>${nets(p.channels)}${badge(p.state)}</button>`).join("") : '<div class="empty"><h3>Žádné výsledky</h3>Zkus jiný dotaz nebo uprav filtry.</div>'}</div>`;
        } else {
          const first = new Date(y, m, 1, 12);
          first.setDate(first.getDate() - ((first.getDay() + 6) % 7));
          const days =
            Math.ceil(
              (((new Date(y, m, 1).getDay() + 6) % 7) +
                new Date(y, m + 1, 0).getDate()) /
                7,
            ) * 7;
          let html =
            '<div class="calendar"><div class="weekdays">' +
            ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"]
              .map((x) => `<div>${x}</div>`)
              .join("") +
            '</div><div class="grid">';
          for (let i = 0; i < days; i++) {
            const d = new Date(first);
            d.setDate(first.getDate() + i);
            const key = dayKey(d),
              items = list.filter((p) => p.date === key);
            html += `<div class="day ${d.getMonth() !== m ? "other" : ""} ${i % 7 >= 5 ? "weekend" : ""} ${key === today() ? "today" : ""}" data-day="${key}"><div class="day-top"><button class="day-add" data-new="${key}" aria-label="Přidat příspěvek ${key}">+</button><button class="day-number" data-new="${key}" aria-label="Nový příspěvek ${key}">${d.getDate()}</button></div>${items.slice(0, 5).map(card).join("")}${items.length > 5 ? `<button class="more" data-day-list="${key}">+ ${items.length - 5} dalších</button>` : ""}</div>`;
          }
          html += "</div></div>";
          $("board").innerHTML = html;
        }
        renderPanel();
      }
      function renderPanel() {
        const p = posts.find((p) => p.id === selected);
        $("workspace").classList.toggle("open", !!p);
        $("panel").classList.toggle("hidden", !p);
        if (!p) return;
        const isNewsletter = p.type === "Newsletter";
        const dateHeading = isNewsletter
          ? "Plánované odeslání"
          : "Datum publikace";
        const copyHeading = isNewsletter ? "Perex newsletteru" : "Text příspěvku";
        const emptyCopy = isNewsletter
          ? "Perex zatím není vyplněný."
          : "Text zatím není vyplněný.";
        const topics = isNewsletter && p.newsletterTopics
          ? `<h3>Témata newsletteru</h3><p class="copy">${esc(p.newsletterTopics)}</p>`
          : "";
        $("panel").innerHTML =
          `<div class="panel-head"><span class="small">${esc(p.type)}</span><button class="close" data-close aria-label="Zavřít detail">×</button></div><h2>${esc(p.title)}</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${nets(p.channels)}${badge(p.state)}</div><h3>${dateHeading}</h3><p>${dateLabel(p.date)} · ${p.time}</p>${topics}<h3>${copyHeading}</h3><p class="copy">${esc(p.text) || `<span class="small">${emptyCopy}</span>`}</p>${p.url ? `<h3>Odkaz</h3><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>` : ""}${p.image ? `<img class="panel-image" src="${p.image}" alt="Náhled příspěvku">` : ""}${p.note ? `<h3>Poznámka</h3><p class="copy">${esc(p.note)}</p>` : ""}<h3>Stav</h3><select class="status-select" aria-label="Změnit stav" id="panel-state">${Object.entries(
            states,
          )
            .map(
              ([k, s]) =>
                `<option value="${k}" ${k === p.state ? "selected" : ""}>${s.name}</option>`,
            )
            .join(
              "",
            )}</select><div class="panel-actions"><button class="primary" data-edit>Upravit</button><button data-locate>Zobrazit v kalendáři</button><button class="danger" data-delete>Odstranit</button></div>`;
        $("panel-state").onchange = async (e) => {
          e.target.disabled = true;
          try {
            await persist({
              ...p,
              state: e.target.value,
              updatedAt: new Date().toISOString(),
            });
            render();
            toast("Stav byl uložen.");
          } catch (err) {
            render();
            toast("Stav se nepodařilo uložit.");
          }
        };
      }
      function imagePreview() {
        $("image-preview").innerHTML = draftImage
          ? `<img class="upload-preview" src="${draftImage}" alt="Náhled obrázku"><p><button type="button" id="remove-image">Odebrat obrázek</button></p>`
          : "";
        if ($("remove-image"))
          $("remove-image").onclick = () => {
            draftImage = "";
            $("image-input").value = "";
            $("form").elements.imageUrl.value = "";
            dirty = true;
            imagePreview();
          };
      }
      function toggleNewsletterFields() {
        const f = $("form");
        const isNewsletter = f.elements.type.value === "Newsletter";
        $("newsletter-fields").classList.toggle("hidden", !isNewsletter);
        $("copy-label").textContent = isNewsletter
          ? "Perex newsletteru"
          : "Text příspěvku";
        f.elements.text.placeholder = isNewsletter
          ? "Krátké uvedení obsahu newsletteru…"
          : "Text, který bude publikován…";
        if (isNewsletter) {
          f.querySelectorAll("[name=net]").forEach(
            (n) => (n.checked = n.value === "NL"),
          );
        }
      }
      function editPost(id = null, date = today()) {
        const p = posts.find((p) => p.id === id);
        editing = p?.id ?? null;
        const f = $("form");
        f.reset();
        f.elements.title.setCustomValidity("");
        f.elements.title.value = p?.title ?? "";
        f.elements.date.value = p?.date ?? date;
        f.elements.time.value = p?.time ?? "09:00";
        f.elements.text.value = p?.text ?? "";
        f.elements.url.value = p?.url ?? "";
        f.elements.type.value = p?.type ?? "Blog";
        f.elements.state.value = p?.state ?? "draft";
        f.elements.note.value = p?.note ?? "";
        f.elements.newsletterTopics.value = p?.newsletterTopics ?? "";
        f.elements.imageUrl.value = p?.image ?? "";
        f.querySelectorAll("[name=net]").forEach(
          (n) => (n.checked = p?.channels.includes(n.value) ?? false),
        );
        toggleNewsletterFields();
        draftImage = p?.image ?? "";
        imagePreview();
        $("editor-title").textContent = p
          ? "Upravit příspěvek"
          : "Nový příspěvek";
        $("form-error").textContent = "";
        $("net-error").textContent = "";
        $("save").disabled = false;
        dirty = false;
        $("editor").showModal();
        f.elements.title.focus();
      }
      async function closeEditor() {
        if (busy) return;
        if (
          dirty &&
          !(await confirmAction(
            "Zahodit změny?",
            "Neuložené změny v příspěvku budou ztraceny.",
          ))
        )
          return;
        $("editor").close();
        dirty = false;
      }
      $("close-editor").onclick = closeEditor;
      $("cancel").onclick = closeEditor;
      $("editor").addEventListener("cancel", (e) => {
        e.preventDefault();
        closeEditor();
      });
      $("form").addEventListener("input", () => (dirty = true));
      $("form").elements.type.onchange = () => {
        toggleNewsletterFields();
        dirty = true;
      };
      $("image-input").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        if (
          !["image/jpeg", "image/png", "image/webp"].includes(f.type) ||
          f.size > 4 * 1024 * 1024
        ) {
          $("form-error").textContent = "Vyber JPG, PNG nebo WebP do 4 MB.";
          e.target.value = "";
          return;
        }
        busy = true;
        $("save").disabled = true;
        try {
          const dataUrl = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = reject;
            r.readAsDataURL(f);
          });
          const result = await api("/api/images", {
            method: "POST",
            body: JSON.stringify({ dataUrl, name: f.name }),
          });
          draftImage = result.url;
          dirty = true;
          imagePreview();
          $("form-error").textContent = "";
        } catch (err) {
          $("form-error").textContent =
            err.message || "Obrázek se nepodařilo uložit.";
        } finally {
          busy = false;
          $("save").disabled = false;
        }
      };
      $("form").elements.imageUrl.onchange = (e) => {
        const url = e.target.value.trim();
        if (!url) {
          draftImage = "";
          imagePreview();
          return;
        }
        if (!/^https?:\/\//i.test(url)) {
          $("form-error").textContent =
            "URL obrázku musí začínat https:// nebo http://.";
          return;
        }
        draftImage = url;
        dirty = true;
        imagePreview();
        $("form-error").textContent = "";
      };
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        if (busy) return;
        const f = e.target,
          channels = [...f.querySelectorAll("[name=net]:checked")].map(
            (n) => n.value,
          );
        $("net-error").textContent = channels.length
          ? ""
          : "Vyber alespoň jednu síť.";
        if (!channels.length) return;
        const title = f.elements.title.value.trim();
        if (!title) {
          f.elements.title.setCustomValidity("Vyplň název příspěvku.");
          f.elements.title.reportValidity();
          f.elements.title.oninput = () =>
            f.elements.title.setCustomValidity("");
          return;
        }
        const url = f.elements.url.value.trim();
        if (url && !/^https?:\/\//i.test(url)) {
          $("form-error").textContent =
            "Odkaz musí začínat https:// nebo http://.";
          return;
        }
        const old = posts.find((p) => p.id === editing),
          record = {
            id: editing ?? crypto.randomUUID(),
            title,
            date: f.elements.date.value,
            time: f.elements.time.value,
            channels,
            text: f.elements.text.value,
            url,
            type: f.elements.type.value,
            state: f.elements.state.value,
            newsletterTopics: f.elements.newsletterTopics.value,
            note: f.elements.note.value,
            image: draftImage,
            createdAt: old?.createdAt ?? new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };
        busy = true;
        $("save").disabled = true;
        try {
          await persist(record);
          selected = record.id;
          month = parseDay(record.date);
          dirty = false;
          $("editor").close();
          render();
          toast("Příspěvek byl uložen.");
        } catch (err) {
          $("form-error").textContent =
            "Uložení se nepodařilo. Zkontroluj volné místo a povolení prohlížeče; text zůstává ve formuláři.";
        } finally {
          busy = false;
          $("save").disabled = false;
        }
      };
      $("new").onclick = () => editPost();
      $("prev").onclick = () => {
        month = new Date(month.getFullYear(), month.getMonth() - 1, 1, 12);
        render();
      };
      $("next").onclick = () => {
        month = new Date(month.getFullYear(), month.getMonth() + 1, 1, 12);
        render();
      };
      $("today").onclick = () => {
        month = parseDay(today());
        render();
      };
      ["search", "from", "to"].forEach((id) =>
        $(id).addEventListener(id === "search" ? "input" : "change", render),
      );
      document.querySelectorAll("[data-filter]").forEach((n) =>
        n.addEventListener("change", () => {
          const group = n.dataset.filter,
            checked = [
              ...document.querySelectorAll(`[data-filter=${group}]:checked`),
            ];
          $(group + "-label").textContent = checked.length
            ? `${group === "channel" ? "Sítě" : "Stavy"} (${checked.length})`
            : group === "channel"
              ? "Všechny sítě"
              : "Všechny stavy";
          render();
        }),
      );
      $("reset").onclick = () => {
        document
          .querySelectorAll("[data-filter]")
          .forEach((n) => (n.checked = false));
        $("channel-label").textContent = "Všechny sítě";
        $("status-label").textContent = "Všechny stavy";
        ["search", "from", "to"].forEach((id) => ($(id).value = ""));
        render();
      };
      $("board").onclick = (e) => {
        const post = e.target.closest("[data-post]"),
          day = e.target.closest("[data-new]"),
          more = e.target.closest("[data-day-list]"),
          dayCell = e.target.closest("[data-day]");
        if (post) {
          selected = post.dataset.post;
          render();
        } else if (day) {
          editPost(null, day.dataset.new);
        } else if (more) {
          const key = more.dataset.dayList;
          $("board").innerHTML =
            `<div class="list"><button id="back-calendar">Zpět do kalendáře</button><h2>${dateLabel(key)}</h2>${filtered()
              .filter((p) => p.date === key)
              .map((p) => card(p))
              .join("")}</div>`;
          $("back-calendar").onclick = render;
        } else if (dayCell) editPost(null, dayCell.dataset.day);
      };
      $("board").addEventListener("dragstart", (e) => {
        const c = e.target.closest("[data-post]");
        if (!c) return;
        e.dataTransfer.setData("text/plain", c.dataset.post);
        e.dataTransfer.effectAllowed = "move";
      });
      $("board").addEventListener("dragover", (e) => {
        const d = e.target.closest("[data-day]");
        if (!d) return;
        e.preventDefault();
        d.classList.add("drag-over");
        e.dataTransfer.dropEffect = "move";
      });
      $("board").addEventListener("dragleave", (e) => {
        const d = e.target.closest("[data-day]");
        if (d && !d.contains(e.relatedTarget)) d.classList.remove("drag-over");
      });
      $("board").addEventListener("dragend", () =>
        document
          .querySelectorAll(".drag-over")
          .forEach((d) => d.classList.remove("drag-over")),
      );
      $("board").addEventListener("drop", async (e) => {
        const d = e.target.closest("[data-day]");
        if (!d) return;
        e.preventDefault();
        d.classList.remove("drag-over");
        const p = posts.find(
          (p) => p.id === e.dataTransfer.getData("text/plain"),
        );
        if (!p || p.date === d.dataset.day) return;
        try {
          await persist({
            ...p,
            date: d.dataset.day,
            updatedAt: new Date().toISOString(),
          });
          render();
          toast("Datum změněno, čas zůstal zachovaný.");
        } catch (err) {
          toast("Přesun se nepodařilo uložit.");
        }
      });
      $("panel").onclick = async (e) => {
        if (e.target.closest("[data-close]")) {
          selected = null;
          render();
          return;
        }
        const p = posts.find((p) => p.id === selected);
        if (!p) return;
        if (e.target.closest("[data-edit]")) editPost(p.id);
        if (e.target.closest("[data-locate]")) {
          $("search").value = "";
          month = parseDay(p.date);
          render();
        }
        if (e.target.closest("[data-delete]")) {
          if (
            !(await confirmAction(
              "Odstranit příspěvek?",
              `Příspěvek „${p.title}“ bude trvale odstraněn.`,
            ))
          )
            return;
          try {
            await persist(p, true);
            selected = null;
            render();
            toast("Příspěvek byl odstraněn.");
          } catch (err) {
            toast("Odstranění se nepodařilo.");
          }
        }
      };
      $("demo").onclick = async () => {
        if (posts.length) return;
        $("demo").disabled = true;
        const examples = [
          [
            "Ukázka · Kanceláře pro Gen Z",
            3,
            "09:00",
            ["FB", "LI"],
            "pending",
            "Jak se mění očekávání od pracovního prostředí? Nový článek přináší pohled na kanceláře pro mladší generaci.",
          ],
          [
            "Ukázka · Ze zákulisí projektu",
            8,
            "10:30",
            ["IG"],
            "draft",
            "Pohled do přípravy nového prostoru.",
          ],
          [
            "Ukázka · Nový článek na blogu",
            14,
            "08:00",
            ["LI"],
            "approved",
            "Inspirace pro prostory, kde se lidem dobře pracuje.",
          ],
          [
            "Ukázka · Tým v terénu",
            19,
            "16:00",
            ["FB", "IG"],
            "draft",
            "Společný den mimo kancelář.",
          ],
          [
            "Ukázka · Dokončený projekt",
            24,
            "09:00",
            ["FB", "LI"],
            "published",
            "Prohlédněte si nový projekt.",
          ],
        ];
        try {
          for (const [title, day, time, channels, state, text] of examples)
            await persist({
              id: crypto.randomUUID(),
              title,
              date: `${month.getFullYear()}-${String(month.getMonth() + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`,
              time,
              channels,
              state,
              text,
              url: "https://example.com/clanek",
              type: "Blog",
              note: "Ukázkový příspěvek pro vyzkoušení aplikace. Můžeš ho upravit nebo odstranit.",
              image: "",
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
            });
          render();
          toast("Ukázkové příspěvky byly vloženy.");
        } catch (err) {
          toast("Ukázková data se nepodařilo uložit.");
          render();
        } finally {
          $("demo").disabled = false;
        }
      };
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      async function boot() {
        render();
        try {
          await openDB();
          render();
        } catch (err) {
          $("intro").classList.add("hidden");
          $("board").innerHTML =
            `<div class="list empty"><h3>Společné úložiště není připravené</h3><p>${esc(err.message || "Zkontroluj databázi a proměnné prostředí ve Vercelu.")}</p><button id="retry">Zkusit znovu</button></div>`;
          $("retry").onclick = boot;
          $("new").disabled = true;
          return;
        }
        $("new").disabled = false;
        const context = document.modelContext;
        if (context?.registerTool) {
          try {
            context.registerTool({
              name: "search_content_posts",
              title: "Najít příspěvky",
              description:
                "Vyhledá lokální příspěvky a zobrazí výsledky ve stejném content plánu.",
              inputSchema: {
                type: "object",
                properties: { query: { type: "string" } },
                required: ["query"],
                additionalProperties: false,
              },
              annotations: { readOnlyHint: true },
              execute(input) {
                if (typeof input.query !== "string")
                  throw Error("query musí být text");
                $("search").value = input.query;
                render();
                return filtered().map(
                  ({ id, title, date, time, state, channels }) => ({
                    id,
                    title,
                    date,
                    time,
                    state,
                    channels,
                  }),
                );
              },
            });
          } catch (err) {
            console.warn("WebMCP unavailable", err);
          }
        }
      }
      boot();
    </script>
  </body>
</html>
